<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Creality Print statically links an old FreeType and exports its symbols, so the
     system cairo/freetype end up mixing two FreeType versions. That segfaults in
     tt_apply_mvar as soon as a variable font (e.g. Adwaita Sans) is laid out.
     Hiding variable fonts from the app avoids that code path. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="variable"><bool>true</bool></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
